name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  golangci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be a release built with Go >= the module's go directive (1.27).
          # v2.10.1 is built with go1.26 and fails with
          # "can't load config: ... lower than the targeted Go version (1.27)".
          version: v2.13.2
