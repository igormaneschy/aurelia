name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  golangci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # golangci-lint 2.13.x supports export data up to version 4; Go
          # 1.27.3 emits version 5 and every stdlib import fails typecheck.
          # Keep lint on 1.27.0 until a golangci-lint release catches up.
          go-version: '1.27.0'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be a release built with Go >= the module's go directive (1.27).
          # v2.10.1 is built with go1.26 and fails with
          # "can't load config: ... lower than the targeted Go version (1.27)".
          version: v2.13.2
