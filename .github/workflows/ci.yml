name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m ./...

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-security-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-security-
            ${{ runner.os }}-go-

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -include=G401,G402,G404,G501,G502,G503,G504,G505,G506,G507,G601,G602 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  bridge-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci

      - name: Typecheck bridge
        working-directory: bridge
        run: npm run typecheck

      - name: Build bridge
        working-directory: bridge
        run: npm run build

      - name: Test bridge policy
        working-directory: bridge
        run: npm test

      - name: Verify bridge bundle is in sync
        run: |
          if ! git diff --stat --exit-code bridge/bundle.js internal/bridge/bundle.js; then
            echo "ERROR: bridge bundle is out of sync. Run 'cd bridge && npm run build && cp bundle.js ../internal/bridge/bundle.js' and commit the changes."
            exit 1
          fi

  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Configure git
        run: |
          git config --global user.email "ci@aurelia.test"
          git config --global user.name "Aurelia CI"

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Race test async hot paths
        run: go test -race ./internal/pipeline ./internal/telegram

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Verify Go build compiles cleanly
        run: go build -trimpath -ldflags "-s -w" -o ./build/aurelia ./cmd/aurelia

  tui-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Build aurelia-tui (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/aurelia-tui-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/aurelia-tui

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/aurelia-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
