[package]
name = "aurelia-ipc"
version = "0.1.0"
edition = "2021"
description = "Rust IPC client for the Aurelia daemon"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
